<!DOCTYPE html>
<html lang="en">

<head>
  <title>AI Hand Detection</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js" type="text/javascript"></script>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">AI Hand Detection</h1>
      <p class="app-subtitle">Track hand landmarks in real time from your camera</p>
    </header>

    <h2 id="loadingText" class="loading-text">Loading model and camera...</h2>

    <!-- video with size of 0px because of chrome -->
    <video playsinline autoplay muted controls="true" id="video"></video>

    <div class="stage">
      <canvas id="c1" class="mirror preview-canvas"></canvas>
      <div class="status-bar">
        <span id="statusBadge" class="status-badge is-idle">AI off</span>
        <span id="handCount" class="hand-count">Hands: 0</span>
      </div>
    </div>

    <section class="controls panel">
      <table>
        <tr>
          <td>AI:</td>
          <td>
            <div class="switch">
              <label>
                Off
                <input type="checkbox" id="ai" disabled>
                <span class="lever"></span>
                On
              </label>
            </div>
          </td>
        </tr>
        <tr>
          <td>FPS:</td>
          <td>
            <p class="range-field">
              <input type="range" id="fps" min="1" max="40" value="30">
            </p>
          </td>
        </tr>
      </table>
    </section>
  </div>

  <!-- is needed to prevent lag at first predict -->
  <img src="mouse/pointer.png" id="img" style="display: none;">

  <script>
    var modelIsLoaded = false;

    // Create a handpose method
    const handpose = ml5.handpose({}, {}, modelLoaded);

    // When the model is loaded
    function modelLoaded() {
      let img = document.getElementById("img");

      handpose.predict(img, results => {
        console.log(results)
        console.log("Model Loaded!");
        modelIsLoaded = true;
      });

    }
  </script>
  <script src="video.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
